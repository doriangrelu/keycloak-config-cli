spring.cache.type=NONE
spring.main.web-application-type=NONE
spring.main.log-startup-info=true
spring.main.banner-mode=off
spring.main.lazy-initialization=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.availability.ApplicationAvailabilityAutoConfiguration

keycloak.version=@keycloak.version@
normalize.version=@keycloak.version@

keycloak.login-realm=master
keycloak.user=admin
keycloak.client-secret=
keycloak.grant-type=password
keycloak.client-id=admin-cli
keycloak.ssl-verify=true
keycloak.connect-timeout=10s
keycloak.read-timeout=10s
keycloak.availability-check.enabled=false
keycloak.availability-check.timeout=120s
keycloak.availability-check.retry-delay=2s
import.validate=true
import.dry-run=false
import.dry-run-format=text
import.files.excludes=""
import.files.include-hidden-files=false
import.behaviors.remove-default-role-from-user=false
import.behaviors.skip-attributes-for-federated-user=false
import.behaviors.sync-user-federation=false

logging.group.http=org.apache.http.wire
logging.group.realm-config=io.github.doriangrelu.keycloak.config.infrastructure.source,io.github.doriangrelu.keycloak.config.infrastructure.keycloak.mapping.RealmDocuments
logging.group.keycloak-config-cli=io.github.doriangrelu.keycloak.config.service,io.github.doriangrelu.keycloak.config.KeycloakConfigRunner,io.github.doriangrelu.keycloak.config.provider.KeycloakProvider
logging.group.kcc=io.github.doriangrelu.keycloak.config.service,io.github.doriangrelu.keycloak.config.KeycloakConfigRunner,io.github.doriangrelu.keycloak.config.provider.KeycloakProvider
